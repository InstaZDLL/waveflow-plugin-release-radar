schema_version = 1

[plugin]
id = "release-radar"
name = "Release Radar"
version = "0.1.0"
author = "InstaZDLL"
world = "waveflow:ui/v1"
description = "Finds recent releases from the artists in your library, with release information from MusicBrainz and artwork from the Cover Art Archive."
homepage = "https://github.com/InstaZDLL/waveflow-plugin-release-radar"
license = "MIT"

# Propagated to the other locales, like every user-facing string in the
# app. Japanese, Korean and both Chinese were reviewed by native
# speakers.
[plugin.description_i18n]
fr = "Trouve les sorties récentes des artistes de votre bibliothèque, avec les informations de MusicBrainz et les pochettes de Cover Art Archive."
es = "Encuentra lanzamientos recientes de los artistas de tu biblioteca, con la información de MusicBrainz y las portadas de Cover Art Archive."
de = "Findet neue Veröffentlichungen der Künstler in deiner Bibliothek, mit Angaben von MusicBrainz und Covern aus dem Cover Art Archive."
it = "Trova le uscite recenti degli artisti della tua libreria, con le informazioni di MusicBrainz e le copertine di Cover Art Archive."
nl = "Vindt recente releases van de artiesten in je bibliotheek, met releasegegevens van MusicBrainz en hoezen van het Cover Art Archive."
pt = "Encontra lançamentos recentes dos artistas da tua biblioteca, com informação do MusicBrainz e capas do Cover Art Archive."
"pt-BR" = "Encontra lançamentos recentes dos artistas da sua biblioteca, com informações do MusicBrainz e capas do Cover Art Archive."
ru = "Находит новые релизы артистов из вашей библиотеки: сведения — из MusicBrainz, обложки — из Cover Art Archive."
tr = "Kitaplığınızdaki sanatçıların yeni çıkışlarını bulur; bilgiler MusicBrainz'den, kapaklar Cover Art Archive'dan gelir."
id = "Mencari rilis terbaru dari artis di pustakamu, dengan informasi rilis dari MusicBrainz dan sampul dari Cover Art Archive."
ja = "ライブラリ内のアーティストによる最近のリリースを、MusicBrainz のリリース情報と Cover Art Archive のアートワークとともに探し出します。"
ko = "라이브러리에 있는 아티스트의 최근 발매 작품을 찾으며, MusicBrainz의 발매 정보와 Cover Art Archive의 아트워크를 함께 제공합니다."
"zh-CN" = "查找音乐库中艺术家的近期发行作品，发行信息来自 MusicBrainz，封面来自 Cover Art Archive。"
"zh-TW" = "尋找您音樂庫中藝人的近期發布作品，並提供來自 MusicBrainz 的發行資訊與 Cover Art Archive 的封面圖片。"
ar = "يجد الإصدارات الحديثة لفنانين مكتبتك، مع معلومات الإصدار من MusicBrainz والأغلفة من Cover Art Archive."
hi = "आपकी लाइब्रेरी के कलाकारों की नई रिलीज़ खोजता है — रिलीज़ की जानकारी MusicBrainz से और आर्टवर्क Cover Art Archive से।"

[permissions]
# The plugin queries only the MusicBrainz web-service (release-group
# search). Cover Art Archive covers + the "View on MusicBrainz" links
# are loaded/opened by the app itself (an <img> in the webview / the OS
# browser), NOT through the plugin's HTTP import — so they don't need to
# be allowlisted here.
http = ["https://musicbrainz.org/**"]
storage_read = false
# Caches the resolved release list + the scan cursor so re-opening the
# view is instant and a scan resumes where it left off.
storage_state = true
# Redacted artist read (names + aggregate track counts + opaque ids
# only — no file paths, no per-track rows). Drives which artists the
# radar follows; local-only, so it works offline.
library_read_artists = true
