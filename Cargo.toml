# This crate is NOT part of any host workspace — it builds for
# wasm32-wasip1 via `cargo component build` (cargo-component wraps the
# module into a true wasip2 Component). The empty workspace marker
# stops cargo's upward auto-discovery from attaching it to a parent.
[workspace]

[package]
name = "waveflow-plugin-release-radar"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "WaveFlow plugin — Release Radar: recent releases from your library's artists via MusicBrainz"
authors = ["InstaZDLL <github.105mh@8shield.net>"]
publish = false

# Component Model output. `cargo component build` wraps this cdylib into
# a true wasm component via wasm-tools.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Guest-side bindings runtime. `cargo component` generates the typed
# bindings from `wit/` and this backs them at runtime.
wit-bindgen-rt = { version = "0.44", features = ["bitflags"] }
# Pure-Rust JSON for the MusicBrainz responses + the view descriptor.
# No reqwest — all HTTP is routed through the host's `waveflow:host/http`
# import, which enforces the manifest's allowlist.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.component]
package = "waveflow:release-radar"

[package.metadata.component.target]
path = "wit"
world = "plugin"

# cargo-component's wit-parser needs the host package pointed at
# explicitly so `world.wit`'s `import waveflow:host/*` resolves.
[package.metadata.component.target.dependencies]
"waveflow:host" = { path = "wit/deps/waveflow-host" }

# Small release wasm — this ships as a downloadable plugin.
[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
